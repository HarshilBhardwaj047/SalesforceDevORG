name: Cleanup Stale Branches

on:
  schedule:
    - cron: '0 2 * * 0'  # Sundays 02:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run (only log, don't delete)
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']
      days_old:
        description: Delete branches older than X days
        required: false
        default: '60'
        type: string

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Delete stale and merged branches
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const DAYS_OLD = parseInt('${{ github.event.inputs.days_old || 60 }}', 10);
            const DRY_RUN = '${{ github.event.inputs.dry_run || 'false' }}' === 'true';

            const PROTECTED_BRANCHES = [
              'main', 'master', 'develop', 'qa', 'stage', 'pre-prod-validation',
              'deployments-ledger',
            ];
            const PROTECTED_PATTERNS = [
              /^release\/.*/, /^hotfix\/.*/, /^v\d+(\.\d+)*(\.x)?$/,
            ];

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const cutoff = new Date(Date.now() - DAYS_OLD * 86400000);
            core.info(`Cutoff: ${cutoff.toISOString()}, dry_run: ${DRY_RUN}`);

            let repoProtected = new Set();
            try {
              const branches = await github.paginate(
                github.rest.repos.listBranches,
                { owner, repo, protected: true, per_page: 100 }
              );
              branches.forEach(b => repoProtected.add(b.name));
            } catch (err) { core.warning(err.message); }

            const isProtected = name =>
              PROTECTED_BRANCHES.includes(name) ||
              repoProtected.has(name) ||
              PROTECTED_PATTERNS.some(re => re.test(name));

            const allBranches = await github.paginate(
              github.rest.repos.listBranches, { owner, repo, per_page: 100 }
            );
            const allPulls = await github.paginate(
              github.rest.pulls.list, { owner, repo, state: 'closed', per_page: 100 }
            );
            const branchPR = new Map();
            for (const pr of allPulls) {
              if (pr.head?.repo?.full_name !== `${owner}/${repo}`) continue;
              const existing = branchPR.get(pr.head.ref);
              if (!existing || (pr.merged_at && !existing.merged_at)) {
                branchPR.set(pr.head.ref, pr);
              }
            }

            const deleted = [], skipped = [], kept = [];
            for (const branch of allBranches) {
              const name = branch.name;
              if (isProtected(name)) { skipped.push({ name, reason: 'protected' }); continue; }
              let commitDate;
              try {
                const { data: c } = await github.rest.repos.getCommit({
                  owner, repo, ref: branch.commit.sha,
                });
                commitDate = new Date(c.commit.committer?.date || c.commit.author?.date);
              } catch (err) {
                skipped.push({ name, reason: 'fetch failed' }); continue;
              }
              const pr = branchPR.get(name);
              const isStale = commitDate < cutoff;
              const isMerged = pr?.merged_at;
              const isClosed = pr && !pr.merged_at && pr.state === 'closed';
              let reason = isMerged ? `PR #${pr.number} merged`
                : isClosed ? `PR #${pr.number} closed`
                : isStale ? `stale (${commitDate.toISOString().split('T')[0]})` : null;
              if (!reason) { kept.push({ name }); continue; }
              if (DRY_RUN) { deleted.push({ name, reason, dryRun: true }); continue; }
              try {
                await github.rest.git.deleteRef({ owner, repo, ref: `heads/${name}` });
                deleted.push({ name, reason });
              } catch (err) {
                skipped.push({ name, reason: `delete failed: ${err.message}` });
              }
            }

            await core.summary
              .addHeading('Branch Cleanup Summary')
              .addRaw(`**Mode:** ${DRY_RUN ? 'Dry Run' : 'Live'}\n\n`)
              .addHeading(`Deleted (${deleted.length})`, 3)
              .addTable([
                [{ data: 'Branch', header: true }, { data: 'Reason', header: true }],
                ...deleted.map(d => [d.name, d.reason]),
              ])
              .addHeading(`Kept (${kept.length})`, 3)
              .write();
